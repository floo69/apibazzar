<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APIBazaar | Deploy</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen p-8">
    <header class="text-center mb-12">
        <h1 class="text-4xl font-black text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-emerald-400">APIBazaar</h1>
        <p class="text-gray-400">Select APIs → Deploy to Kubernetes</p>
    </header>

    <main class="max-w-4xl mx-auto grid grid-cols-1 md:grid-cols-2 gap-6">
        <div class="bg-gray-800 p-6 rounded-xl border border-gray-700 shadow-lg">
            <h2 class="text-xl font-bold mb-2">Payment Gateway API</h2>
            <p class="text-gray-400 text-sm mb-6">Mock Razorpay integration for transaction testing.</p>
            <button onclick="deployAPI('payment', 'bazaar-payment')" id="btn-payment" class="w-full bg-blue-600 hover:bg-blue-500 py-3 rounded-lg font-bold transition-all">Deploy to K8s</button>
        </div>

        <div class="bg-gray-800 p-6 rounded-xl border border-gray-700 shadow-lg">
            <h2 class="text-xl font-bold mb-2">GST Lookup API</h2>
            <p class="text-gray-400 text-sm mb-6">Verify Indian GSTINs with real-time mock data.</p>
            <button onclick="deployAPI('gst', 'bazaar-gst')" id="btn-gst" class="w-full bg-blue-600 hover:bg-blue-500 py-3 rounded-lg font-bold transition-all">Deploy to K8s</button>
        </div>
    </main>

    <section id="status-container" class="hidden mt-12 max-w-xl mx-auto bg-gray-800 p-6 rounded-xl border border-blue-500/30 text-center">
        <p id="status-text" class="text-lg mb-4 italic">Deploying...</p>
        <div id="url-container" class="hidden p-3 bg-black rounded border border-emerald-500/50">
            <span class="text-xs text-gray-500 block mb-1">LIVE ENDPOINT:</span>
            <a id="api-url" href="#" target="_blank" class="text-emerald-400 underline break-all font-mono"></a>
        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
